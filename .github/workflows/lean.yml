name: Lean kernel smoke and axiom audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4 toolchain
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.28.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib release
        run: lake update
      - name: Download Mathlib compiled cache
        run: lake exe cache get
      - name: Compile Lean smoke theorem and print axioms
        run: lake env lean lean/USF.lean | tee lean_axioms.txt
      - name: Strict axiom allowlist audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from usf06.logos import parse_axiom_output
          output = Path('lean_axioms.txt').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          observed = parse_axiom_output(output, 'USF.ring_example')
          assert observed is not None, f'Missing axiom report: {output}'
          assert set(observed).issubset(allowed), f'Unapproved axioms: {observed}'
          assert 'sorryAx' not in output
          print('Lean axiom audit passed:', observed)
          PY
